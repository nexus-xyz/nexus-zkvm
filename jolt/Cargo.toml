jolt-core = { git = "https://github.com/a16z/jolt", rev = "8292b493ae4645696634b44e7c1208d7c5db8314" }
jolt-common = { git = "https://github.com/a16z/jolt", rev = "8292b493ae4645696634b44e7c1208d7c5db8314", package = "common" }
