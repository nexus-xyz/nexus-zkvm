[package]
name = "nexus-jolt"
version = "0.1.0"
edition = "2021"

[dependencies]
nexus-vm = { path = "../vm" }

tracing = { version = "0.1", default-features = false }
thiserror = "1.0"
rayon = "1.8"
strum = "0.25.0"

ark-bn254 = "0.5.0"

# latest commit on legacy-compat. nexus-xyz/jolt is no longer public; this commit is still
